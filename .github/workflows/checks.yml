name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core tests (rules, economy, every level solvable)
        run: dotnet test dotnet/KnittedPicture.Core.Tests

      - name: Game code compiles against Unity reference assemblies
        run: dotnet build dotnet/KnittedPicture.Game.Check

      - name: In-game QA bot compiles (dev builds only)
        run: dotnet build dotnet/KnittedPicture.Game.Check -p:UnityPlatform=KNITTED_QA

      - name: Levels are up to date with levels-src
        run: |
          dotnet run --project dotnet/KnittedPicture.LevelTool
          git diff --exit-code -- Assets/Resources/Levels

      - name: Playtest bot (rules, meta-game over many days)
        run: dotnet run -c Release --project dotnet/KnittedPicture.Playtest -- --runs 60 --generated 20 --difficulty-runs 0 --players 10 --days 45 --report playtest-report.md

      - name: Playtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-report
          path: playtest-report.md
          if-no-files-found: ignore

      - name: Deep QA bot (personas, oracles, edge levels, clock jumps; minimal repro + screenshots)
        run: dotnet run -c Release --project dotnet/KnittedPicture.QA -- --quick --out qa-out

      - name: Deep QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-out
          if-no-files-found: ignore
